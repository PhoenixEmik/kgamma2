name: Build and release Linux packages

on:
  push:
    branches:
      - main
      - ci/**
    tags:
      - v*
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate version
        id: version
        run: |
          set -euo pipefail
          version="$(awk '$1 == "Version:" { print $2; exit }' packaging/opensuse/kgamma2.spec)"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            release=true
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Building kgamma2 $version (release: $release)"

  opensuse-rpm:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install packaging tools
        run: |
          set -euo pipefail
          # Align the rolling container image with the repository snapshot.
          zypper --non-interactive --gpg-auto-import-keys dist-upgrade --allow-downgrade --no-recommends
          zypper --non-interactive --gpg-auto-import-keys --no-refresh install --allow-downgrade --no-recommends \
            git rpm-build make tar gzip

      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build requirements from spec
        run: |
          set -euo pipefail
          rpmspec -q --buildrequires packaging/opensuse/kgamma2.spec > "$RUNNER_TEMP/build-requires.txt"
          mapfile -t packages < "$RUNNER_TEMP/build-requires.txt"
          zypper --non-interactive --gpg-auto-import-keys --no-refresh install --allow-downgrade --no-recommends "${packages[@]}"

      - name: Build and test RPM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(Version:[[:space:]]*).*/\1$VERSION/" packaging/opensuse/kgamma2.spec
          test "$(rpmspec -q --qf '%{VERSION}\n' packaging/opensuse/kgamma2.spec)" = "$VERSION"
          topdir="$RUNNER_TEMP/kgamma2-rpmbuild"
          mkdir -p "$topdir"/{BUILD,RPMS,SOURCES,SPECS,SRPMS,tmp}
          tar --exclude-vcs --exclude=build --exclude=dist \
            --transform="s|^./|kgamma2-$VERSION/|" \
            -czf "$topdir/SOURCES/kgamma2-$VERSION.tar.gz" .
          rpmbuild --define "_topdir $topdir" --define "_tmppath $topdir/tmp" \
            -ba packaging/opensuse/kgamma2.spec
          mkdir -p dist
          cp "$topdir"/RPMS/*/*.rpm "$topdir"/SRPMS/*.rpm dist/
          cd dist
          sha256sum ./*.rpm > SHA256SUMS-opensuse-tumbleweed

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kgamma2-${{ needs.version.outputs.version }}-opensuse-tumbleweed-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  fedora-rpm:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    defaults:
      run:
        shell: bash

    steps:
      - name: Install packaging tools
        run: dnf --assumeyes install git rpm-build tar gzip

      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build requirements from spec
        run: |
          set -euo pipefail
          mapfile -t packages < <(rpmspec -q --buildrequires packaging/fedora/kgamma2.spec)
          dnf --assumeyes install "${packages[@]}"

      - name: Build and test RPM
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(Version:[[:space:]]*).*/\1$VERSION/" packaging/fedora/kgamma2.spec
          test "$(rpmspec -q --qf '%{VERSION}\n' packaging/fedora/kgamma2.spec)" = "$VERSION"
          topdir="$RUNNER_TEMP/kgamma2-fedora-rpmbuild"
          mkdir -p "$topdir"/{BUILD,RPMS,SOURCES,SPECS,SRPMS,tmp}
          tar --exclude-vcs --exclude=build --exclude=dist \
            --transform="s|^./|kgamma2-$VERSION/|" \
            -czf "$topdir/SOURCES/kgamma2-$VERSION.tar.gz" .
          rpmbuild --define "_topdir $topdir" --define "_tmppath $topdir/tmp" \
            -ba packaging/fedora/kgamma2.spec
          mkdir -p dist
          cp "$topdir"/RPMS/*/*.rpm "$topdir"/SRPMS/*.rpm dist/
          cd dist
          sha256sum ./*.rpm > SHA256SUMS-fedora-45

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kgamma2-${{ needs.version.outputs.version }}-fedora-45-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  ubuntu-deb:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Install packaging tools and dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cmake debhelper desktop-file-utils dpkg-dev \
            extra-cmake-modules g++ git libkf6config-dev libkf6i18n-dev \
            libkirigami-dev libkscreen-bin libkscreen-dev liblcms2-dev pkgconf \
            qt6-base-dev qt6-declarative-dev

      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test DEB
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "1s/\([^)]*\)/($VERSION)/" debian/changelog
          test "$(dpkg-parsechangelog -SVersion)" = "$VERSION"
          if ! dpkg-buildpackage --build=binary --no-sign 2>&1 \
            | tee "$RUNNER_TEMP/ubuntu-build.log"; then
            message="$(tail -n 80 "$RUNNER_TEMP/ubuntu-build.log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Ubuntu package build failed::$message"
            exit 1
          fi
          mkdir -p dist
          find .. -maxdepth 1 -type f -name '*.deb' -exec cp '{}' dist/ \;
          cd dist
          sha256sum ./*.deb > SHA256SUMS-ubuntu-26.04

      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: kgamma2-${{ needs.version.outputs.version }}-ubuntu-26.04-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  arch-package:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install packaging tools and dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake extra-cmake-modules git kconfig ki18n kirigami \
            libkscreen lcms2 desktop-file-utils qt6-base qt6-declarative

      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test Arch package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/kgamma2-arch-package"
          mkdir -p "$package_root"
          tar --exclude-vcs --exclude=build --exclude=dist \
            --transform="s|^./|kgamma2-$VERSION/|" \
            -czf "$package_root/kgamma2-$VERSION.tar.gz" .
          checksum="$(sha256sum "$package_root/kgamma2-$VERSION.tar.gz" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$checksum/g" \
            packaging/arch/PKGBUILD.in > "$package_root/PKGBUILD"
          useradd --create-home builder
          chown -R builder:builder "$package_root"
          su builder -c "cd '$package_root' && makepkg --cleanbuild --noconfirm"
          mkdir -p dist
          cp "$package_root"/*.pkg.tar.zst dist/
          cd dist
          sha256sum ./*.pkg.tar.zst > SHA256SUMS-arch-linux

      - name: Upload Arch packages
        uses: actions/upload-artifact@v4
        with:
          name: kgamma2-${{ needs.version.outputs.version }}-arch-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, opensuse-rpm, fedora-rpm, ubuntu-deb, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kgamma2-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          rm -f SHA256SUMS-*
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "kgamma2 $TAG" \
              --generate-notes
          fi
